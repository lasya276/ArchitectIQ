version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: architectiq_postgres
    restart: always
    environment:
      POSTGRES_USER: architect_user
      POSTGRES_PASSWORD: architect_secure_password
      POSTGRES_DB: architectiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architect_user -d architectiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: architectiq_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=architect_user
      - POSTGRES_PASSWORD=architect_secure_password
      - POSTGRES_DB=architectiq_db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - CHROMA_DB_PATH=/app/chroma_data
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: architectiq_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
